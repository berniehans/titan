[workspace]
members = ["engine-api", "engine-core", "engine-io", "engine-cuda", "engine-kvcache", "engine-server"]
resolver = "3"

[workspace.dependencies]
cudarc = { version = "0.12.1", default-features = false, features = ["driver", "std", "cuda-12000"] }
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
tokio-macros = "2.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = "0.13.4"
futures-core = "0.3.34"
futures-util = "0.3.34"
anyhow = "1.9.0"
thiserror = "2.0"
tracing = "0.1"
